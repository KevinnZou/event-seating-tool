name: Publish independent Pages site
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "整体验收通过后，输入 发布 event-seating-tool"
        required: true
        type: string
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-release
  cancel-in-progress: false
jobs:
  quality:
    if: >-
      github.event.repository.name == 'event-seating-tool' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirmation == '发布 event-seating-tool') ||
      (github.event_name == 'push' && vars.ENABLE_PAGES_DEPLOY == 'true'))
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages-ready-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish static artifact
        id: deployment
        uses: actions/deploy-pages@v4
